<!DOCTYPE html>
<head>   
   <title>Exemplo especificidade de seletores</title>
   <style>
      /*regra 1 aplica para todas as tags li*/ li{color:red;}
      /*regra 2 aplica para todas as tags que possuem a classe churras*/ .churras{color:green;}
      /*regra 3*aplica para todas as tags que possuem a classe fruta*/ .fruta{color:gray}
      /*regra 4aplica para todas as tags que possuem a classe li e classe churras*/ li+li.churras{color: black;}
      /*regra 5 aplica para todas as tags que possuem a classe churras e sejam arrastadas */ .churras[draggable="true"]{color: magenta;}
      /*regra 6 aplica para os ids selecionadas*/ #lip1,#lip2,#lip3{color:blue}
      /*regra 7 aplica para o id e classe especificada*/ #lip3.fruta{color:orange}
      /*regra 8 aplica para quem esteja em uma ol seja um li e tenha a classe churras*/ ol>li.churras#lip5{color:purple}
   </style>
</head>
<body>   
   <ol>
   <!--item 1--> <li id="lip0">Abacaxi</li>
   <!--item 2--> <li           class="fruta">Melão</li>
   <!--item 3--> <li id="lip2" class="fruta">Pera</li>
   <!--item 4--> <li id="lip3" class="fruta">Uva</li>
   <!--item 5--> <li id="lip4" class="fruta">Maçã</li>
   <!--item 6--> <li           class="churras">Carne</li>
   <!--item 7--> <li           class="churras">Linguiça</li>
   <!--item 8--> <li id="lip7" class="churras" draggable="true">Pão de alho</li>
   </ol>   
</body>
</html>
