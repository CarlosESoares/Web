<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <!--CSS é uma linguagem de estilização exemplo abaixo-->
    <!-- Ultilize a tag style para poder abrir o css logo após coloque o identificador de tag que deseje e manipule-->
    <style>
        p{
            font-size: 100px;
        }
        #p2{
            color: red;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;

        }
    </style>
    <!-- Após isso coloque a tag modifique e aproveite-->
    <p>lorem</p>
    <p id="p2">lorem</p>
    <p style="font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;">a</p>
</body>
</html>
