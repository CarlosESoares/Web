<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .container {
        width: 100vh;
        height: 100vh;
        display:flex;
        grid-template-columns: repeat(2, 100px);
        grid-template-rows: repeat(2, 100px);
        gap: 10px;
    }
    #box1, #box2, #box3, #box4 {
        height: 100px;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        color: white;
    }
    #box1 {
        background-color: red;
    }
    #box2 {
        background-color: blue;
    }
    #box3 {
        background-color: green;
    }
    #box4 {
        background-color: yellow;
           color: black;
    }

</style>
<body>
    <div id="container">
        <div id="box1">1</div>
        <div id="box2">2</div>
        <div id="box3">3</div>
        <div id="box4">4</div>
    </div>
</body>
</html>
