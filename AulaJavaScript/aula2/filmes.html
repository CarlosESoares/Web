<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>busca filmos omdb</title>
</head>
<body>
    <h2>Busca de filmes </h2>
    <label for="">Titulo do filme</label>
    <input type="text" id="titulo" name="titulo">
    <button id="Buscar">buscar</button>

    <div id="filmes"></div>
    
    <script>
        let inputFilme=document.querySelector("#titulo")
        let buscar = document.querySelector("#Buscar")
        let divResultado = document.querySelector("#filmes")
        buscar.addEventListener("click",()=>{
            fetch("http://www.omdbapi.com/?s="+inputFilme.value+"&apikey=f77bfada");
        }).then((response)=>{
            return response.json();
        }).then((data)=>{
            console.log(data);

        })


    </script>
</body>
</html>
