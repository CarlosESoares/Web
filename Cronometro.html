<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cronometro</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .wrapper {
            display: flex;
            gap: 20px;
        }

        .container {
            text-align: center;
            background: #1c1c1c;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
        }

        #tempo {
            font-size: 40px;
            margin-bottom: 20px;
        }

        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        #start {
            background: #4caf50;
            color: white;
        }

        #pause {
            background: #ff9800;
            color: white;
        }

        #reset {
            background: #f44336;
            color: white;
        }

        .pausas {
            background: #1c1c1c;
            padding: 20px;
            border-radius: 10px;
            width: 220px;
            max-height: 300px;
            overflow-y: auto;
        }

        .pausas p {
            margin: 5px 0;
            background: #333;
            padding: 5px;
            border-radius: 3px;
        }
    </style>
</head>

<body>

    <div class="wrapper">

        <div class="container">
            <h2>Cronometro</h2>
            <div id="tempo">00:00:00</div>

            <button id="start">Iniciar</button>
            <button id="pause">Pausar</button>
            <button id="reset">Resetar</button>
        </div>

        <div class="pausas">
            <h4>Tempos de pausa:</h4>
            <div id="listaPausas"></div>
        </div>

    </div>

    <script>
        // Guarda o momento exato em que o cronômetro começou
        let horarioDeInicioDoCronometro = null;

        // Guarda o tempo total acumulado quando houve pausas
        let tempoTotalAcumuladoPausado = 0;

        // Guarda o ID do intervalo para poder iniciar/parar
        let intervaloDeAtualizacaoDoTempo = null;

        // Elemento onde o tempo aparece na tela
        const elementoQueMostraOTempo = document.getElementById("tempo");

        // Lista onde mostramos os registros de pausas
        const listaDeRegistrosDePausa = document.getElementById("listaPausas");


        // Converte milissegundos em HH:MM:SS
        function converterMilissegundosParaFormatoDeRelogio(milissegundos) {
            // Converte ms em segundos inteiros
            let segundosTotais = Math.floor(milissegundos / 1000);

            // Calcula horas, minutos e segundos
            let horas = String(Math.floor(segundosTotais / 3600)).padStart(2, "0");
            let minutos = String(Math.floor((segundosTotais % 3600) / 60)).padStart(2, "0");
            let segundos = String(segundosTotais % 60).padStart(2, "0");

            return `${horas}:${minutos}:${segundos}`;
        }


        // Atualiza o visor do cronômetro na tela
        function atualizarTempoNoVisor() {
            let horarioAgora = new Date(); // pega hora atual do sistema
            let tempoDecorrido = horarioAgora - horarioDeInicioDoCronometro + tempoTotalAcumuladoPausado;
            elementoQueMostraOTempo.textContent = converterMilissegundosParaFormatoDeRelogio(tempoDecorrido);
        }


        // Inicia o cronômetro
        function iniciarContagemDoCronometro() {
            if (intervaloDeAtualizacaoDoTempo) return; // evita iniciar duas vezes

            horarioDeInicioDoCronometro = new Date(); // marca hora do inicio
            intervaloDeAtualizacaoDoTempo = setInterval(atualizarTempoNoVisor, 100); // atualiza 10x/s
        }


        // Pausa o cronômetro
        function pausarContagemDoCronometro() {
            if (!intervaloDeAtualizacaoDoTempo) return; // só pausa se estiver rodando

            clearInterval(intervaloDeAtualizacaoDoTempo); // interrompe o cronômetro
            intervaloDeAtualizacaoDoTempo = null;

            let horarioAgora = new Date(); // pega o momento da pausa
            tempoTotalAcumuladoPausado += horarioAgora - horarioDeInicioDoCronometro; // adiciona ao total

            // Cria item com o tempo pausado
            let novoRegistro = document.createElement("p");
            novoRegistro.textContent = converterMilissegundosParaFormatoDeRelogio(tempoTotalAcumuladoPausado);
            listaDeRegistrosDePausa.appendChild(novoRegistro);
        }


        // Reseta o cronômetro completamente
        function resetarCronometroParaZero() {
            clearInterval(intervaloDeAtualizacaoDoTempo);
            intervaloDeAtualizacaoDoTempo = null;

            horarioDeInicioDoCronometro = null;
            tempoTotalAcumuladoPausado = 0;

            elementoQueMostraOTempo.textContent = "00:00:00";
            listaDeRegistrosDePausa.innerHTML = "";
        }


        // Eventos de clique dos botões
        document.getElementById("start").addEventListener("click", iniciarContagemDoCronometro);
        document.getElementById("pause").addEventListener("click", pausarContagemDoCronometro);
        document.getElementById("reset").addEventListener("click", resetarCronometroParaZero);


        // Atalhos do teclado (S, P, R)
        document.addEventListener("keydown", (e) => {
            if (e.key === "s" || e.key === "S") iniciarContagemDoCronometro();
            if (e.key === "p" || e.key === "P") pausarContagemDoCronometro();
            if (e.key === "r" || e.key === "R") resetarCronometroParaZero();
        });
    </script>

</body>

</html>
