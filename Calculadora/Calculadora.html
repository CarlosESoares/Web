<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Morfador Samurai</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="morpher">
    <div id="Tela">0</div>
    <div class="painel">
        <div class="Numeros">
            <div class="btn">7</div>
            <div class="btn">8</div>
            <div class="btn">9</div>
            <div class="btn op" id="subtração">
                <img src="rosa.jfif">
            </div>
            <div class="btn">4</div>
            <div class="btn">5</div>
            <div class="btn">6</div>
            <div class="btn op" id="divisao">
                <img src="preto.jfif">
            </div>
            <div class="btn">1</div>
            <div class="btn">2</div>
            <div class="btn">3</div>
            <div class="btn op" id="Multiplicacao">
                <img src="dourado.jfif">
            </div>
            <div class="btn">0</div>
            <div class="btn">C</div>
            <div class="btn op" id="Soma">
                <img src="vermelho.jfif">
            </div>
            <div class="btn equal">=</div>
        </div>
    </div>
</div>
<script>
    Soma = document.getElementById("#Soma")
    Divisao = document.getElementById("#Divisao")
    Multiplicacao = document.getElementById("#Multiplicacao")
    Subtracao = document.getElementById("#Subtracao")
    

</script>
</body>
</html>
