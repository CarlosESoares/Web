<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     body {
      margin: 0; /* remove espaçamento padrão */
      padding: 0;
    }

    #container {
      display: flex;       /* coloca as boxes em linha */
      width: 100vw;        /* ocupa toda a largura da janela */
      height: 25vh;        /* altura ajustável */
      border: 1px solid black;
    }

    .box {
      flex: 1;             /* cada box ocupa a mesma proporção */
      display: flex;
      align-items: center; /* centraliza o número verticalmente */
      justify-content: center; /* centraliza o número horizontalmente */
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    #box1 { background-color: purple; }
    #box2 { background-color: green; }
    #box3 { background-color: red; }
    #box4 { background-color: yellow; color: black; }

</style>
<body>
    <div id="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
    </div>
</body>
</html>
