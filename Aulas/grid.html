<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GRID layouts</title>
</head>
    <style>
        .container{
              display: grid;
            height: 75vh;
            width: 80vw;
          /*  grid-template-columns: 1fr 4fr 1fr;
            grid-template-rows: 100px 80vh 20vh;
        */
         /*   grid-template-areas: 
            "item1 item2 item3"
            "item1 item2 item3"
            "item6 item6 item6"
            "item4 item5 item5"
            ;
   */ 

            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: auto auto;
            
            

    }
  /*  #item1{grid-area: item1;}
    #item2{grid-area: item2;}
    #item3{grid-area: item3;}
    #item4{grid-area: item4;}
    #item5{grid-area: item5;}
    #item6{grid-area: item6;}*/

    #item6{
        grid-area: 1 / 3 / 3 / 3;
    }
        .item{
            background-color: #4CAF50;
            color: white;
            border: 2px solid #333;
            padding: 20px;
            font-size: 30px;
            text-align: center;

        }
    </style>

<body>

    <h1>GRID faz parte do CSS versao 2.0</h1>
    <h2>O grid é uma propriedade display que perimite crair layouts complexos de forma simples e eficiente</h2>
    <div class="container">
    <div class="item"id="item1">1</div>
    <div class="item"id="item2">2</div>
    <div class="item"id="item3">3</div>
    <div class="item"id="item4">4</div>
    <div class="item"id="item5">5</div>
    <div class="item"id="item6">6</div>
    </div>
</body>
</html>
