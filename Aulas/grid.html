<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> GRID layouts</title>
</head>
    <style>
        .container{
            display: grid;
            grid-template-columns: 1fr 4fr 1fr;
            grid-template-rows: 100px 80vh 20vh;
        }
        .item{
            background-color: #4CAF50;
            color: white;
            border: 2px solid #333;
            padding: 20px;
            font-size: 30px;
            text-align: center;
        }
    </style>

<body>

    <h1>GRID faz parte do CSS versao 2.0</h1>
    <h2>O grid é uma propriedade display que perimite crair layouts complexos de forma simples e eficiente</h2>
    <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>
    <div class="item item4">4</div>
    <div class="item item5">5</div>
    <div class="item item6">6</div>
    </div>
</body>
</html>
