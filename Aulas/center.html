<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<style>
    body{
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: gray; 
  
    }
    
    #foguete{
    rotate: -30deg;
    font-size: 100px;
    animation: subir 5s ease-in-out infinite;
    }
    @keyframes subir {
        from{
            transform: translateY(100vh);
        }
        to{
            transform: translate(0vh);

        }
    }
    
</style>
<body>


    <div class="box" id="foguete">🚀
</div>
    
    

    

</body>
